waypoint_navigator:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    action_name: navigate_to_pose
    amcl_pose_topic: amcl_pose

    # Mỗi ba giá trị lần lượt là x, y, yaw (rad) trong hệ tọa độ map.
    # Các điểm nằm trong vùng trống của bản đồ small_room.
    goals: [2.6, -1.9, 1.57,
            2.7,  2.1, 3.14,
           -1.0,  2.2, -1.57]
    goal_names: ["Goal 1 - góc dưới phải",
                 "Goal 2 - góc trên phải",
                 "Goal 3 - vùng trên trái"]

    wait_for_initial_pose: true
    initial_delay: 3.0
    wait_between_goals: 2.0
    server_timeout: 90.0
    max_retries: 1
    continue_on_failure: false

yolo_detector:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    annotated_topic: /yolo/annotated_image
    model_path: yolov8n.pt
    confidence: 0.35
    iou_threshold: 0.45
    image_size: 640
    device: cpu
    inference_interval: 0.20
    show_window: false
    publish_annotated: true

